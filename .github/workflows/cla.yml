name: CLA Assistant

# Gates pull requests until the contributor signs the CLA (CLA.md). Signatures are
# stored in this repo (signatures/version1/cla.json) — no third-party service.
# Requires one repo secret: PERSONAL_ACCESS_TOKEN (a fine-grained or classic PAT with
# repo write scope), used to commit the signature file. GITHUB_TOKEN is automatic.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Build-with-Shardul/aurume/blob/main/CLA.md'
          branch: 'main'
          # The Project Owner and bots don't need to sign.
          allowlist: 'Build-with-Shardul,*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution to Aurume. Before it can be merged, please
            read our [Contributor License Agreement](https://github.com/Build-with-Shardul/aurume/blob/main/CLA.md)
            and sign it by posting a comment on this PR with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
